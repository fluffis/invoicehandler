# /etc/logrotate.d/invoice
#
# Rotate the invoice log file weekly, keep 4 weeks.
# Install: sudo cp logrotate-invoice.conf /etc/logrotate.d/invoice

/var/log/invoice.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    postrotate
        /usr/lib/rsyslog/rsyslog-rotate 2>/dev/null || true
    endscript
}
