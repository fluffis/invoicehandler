# /etc/rsyslog.d/invoice.conf
#
# Redirect invoicehandler and invoicefetcher logs to a dedicated file.
# Install: sudo cp rsyslog-invoice.conf /etc/rsyslog.d/invoice.conf
#          sudo systemctl restart rsyslog
#
# Logs go to: /var/log/invoice.log
# Both services still appear in the journal via: journalctl --user -u invoicehandler
#                                                journalctl --user -u invoicefetcher

# Match by program name (set in the syslog formatter)
if $programname == 'invoicehandler' or $programname == 'invoicefetcher' then {
    /var/log/invoice.log
    stop
}
